<!doctype html>
<!-- PROTOTYPE: Three public-site visual systems, switchable with ?variant=A|B|C and ?page=home|docs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AzeForge public-site visual prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
 :root { color-scheme: dark; --red:#ff2419; --ink:#090909; --panel:#111111; --raised:#181818; --line:#303030; --text:#f2eee8; --muted:#aaa49b; --code:#e8e1d7; --display:"Playfair Display", Georgia, "Times New Roman", serif; --sans:"Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
* { box-sizing:border-box; }
html { background:var(--ink); }
body { margin:0; min-width:320px; background:var(--ink); color:var(--text); font:16px/1.5 var(--sans); }
a { color:inherit; text-decoration:none; }
button { font:inherit; }
button:focus-visible, a:focus-visible { outline:2px solid var(--red); outline-offset:3px; }
.prototype-note { position:fixed; z-index:3; top:14px; left:14px; margin:0; color:#000; background:#f3efe9; padding:5px 9px; font:11px/1 var(--mono); }
.shell { min-height:100vh; padding-bottom:96px; }
.site-header { display:flex; align-items:center; justify-content:space-between; max-width:1240px; margin:auto; padding:26px 32px; }
.mark { display:inline-flex; align-items:center; gap:9px; color:var(--text); font-weight:800; letter-spacing:-.06em; font-size:24px; }
.mark img { width:29px; height:29px; object-fit:contain; }
.mark .word { color:var(--text); }
.mark .accent { color:var(--red); }
.site-nav { display:flex; align-items:center; gap:24px; color:var(--muted); font-size:14px; }
.site-nav a[aria-current="page"] { color:var(--text); }
.install-link { color:var(--text); background:var(--red); padding:9px 13px; font-weight:750; }
.eyebrow { margin:0 0 16px; color:var(--red); font:700 12px/1.2 var(--mono); letter-spacing:.08em; text-transform:uppercase; }
h1,h2,h3,p { margin-top:0; }
h1 { letter-spacing:-.07em; line-height:.92; }
h2 { letter-spacing:-.05em; line-height:1.03; }
.lede { color:var(--muted); max-width:590px; font-size:19px; }
.action-row { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
.button { border:1px solid var(--line); padding:11px 16px; font-weight:700; }
.button.primary { border-color:var(--red); background:var(--red); color:#120000; }
.command { display:flex; align-items:center; justify-content:space-between; gap:16px; color:var(--code); background:#101010; border:1px solid var(--line); padding:13px 14px; font:14px/1.2 var(--mono); }
.command button { border:0; background:none; color:var(--muted); cursor:pointer; font:12px/1 var(--sans); }
.command button:hover { color:var(--text); }
.docs-layout { max-width:1240px; margin:30px auto 0; padding:0 32px; display:grid; grid-template-columns:220px minmax(0,720px) 190px; gap:48px; }
.docs-nav { border-right:1px solid var(--line); padding-right:22px; font-size:14px; }
.docs-nav p { color:var(--muted); margin:24px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
.docs-nav a { display:block; padding:5px 0; }
.docs-nav a.active { color:var(--red); }
.docs-content h1 { font-size:64px; margin-bottom:22px; }
.docs-content h2 { margin-top:56px; font-size:31px; }
.docs-content p { max-width:670px; }
.docs-toc { color:var(--muted); font-size:13px; }
.docs-toc a { display:block; padding:6px 0; }
.code-block { margin:22px 0; padding:20px; overflow:auto; background:#101010; border:1px solid var(--line); color:var(--code); font:13px/1.65 var(--mono); white-space:pre; }
.callout { border-left:3px solid var(--red); padding:8px 0 8px 16px; color:var(--muted); }
.switcher { position:fixed; z-index:4; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:11px; border:1px solid #514e49; border-radius:999px; padding:7px; background:#f3efe9; color:#111; box-shadow:0 12px 36px #000a; font-size:13px; }
.switcher button { width:31px; height:31px; border:0; border-radius:50%; background:#171717; color:#fff; cursor:pointer; }
.switcher button:hover { background:var(--red); color:#111; }
.switcher strong { min-width:144px; text-align:center; }
/* A: editorial page with large type and a quiet reading column. */
.variant-a .site-header { border-bottom:1px solid var(--line); }
.variant-a .home-hero { max-width:1240px; margin:50px auto 0; padding:52px 32px 82px; display:grid; grid-template-columns:1.35fr .65fr; gap:54px; }
.variant-a h1 { max-width:760px; font:clamp(60px,9vw,132px)/.84 var(--display); }
.variant-a .hero-side { align-self:end; border-top:1px solid var(--line); padding-top:20px; }
.variant-a .hero-side p { color:var(--muted); }
.variant-a .command { margin-top:38px; max-width:570px; }
.variant-a .proof { max-width:1240px; margin:auto; padding:0 32px; display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid var(--line); }
.variant-a .proof article { padding:29px 24px 34px 0; border-right:1px solid var(--line); }
.variant-a .proof article+article { padding-left:24px; }
.variant-a .proof h2 { font:32px/1 var(--display); }
.variant-a .docs-layout { grid-template-columns:184px minmax(0,650px) 170px; }
.variant-a .docs-content { font-family:var(--sans); font-size:18px; }
.variant-a .docs-content h1, .variant-a .docs-content h2 { font-family:var(--display); }
.variant-a .brand-geometry { position:relative; height:194px; margin:16px 0 26px; overflow:hidden; border-bottom:1px solid var(--line); }
.variant-a .brand-geometry::before { content:""; position:absolute; right:5%; bottom:-38px; width:232px; height:202px; background:linear-gradient(135deg,#ff2419,#6f0b0b); clip-path:polygon(50% 0,100% 100%,80% 100%,50% 31%,20% 100%,0 100%); opacity:.72; }
.variant-a .brand-geometry::after { content:""; position:absolute; right:29%; bottom:-8px; width:102px; height:96px; background:#090909; clip-path:polygon(50% 0,100% 100%,72% 100%,50% 47%,28% 100%,0 100%); }
.variant-a .brand-geometry img { position:absolute; right:13%; bottom:-3px; width:142px; height:142px; object-fit:contain; opacity:.38; mix-blend-mode:screen; }
/* B: an operational console, dense and command-first. */
.variant-b { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
.variant-b .site-header { max-width:none; padding:15px 24px; background:#121212; border-bottom:1px solid var(--line); }
.variant-b .mark { font:800 18px/1 ui-monospace, monospace; letter-spacing:-.07em; }
.variant-b .site-nav { font-family:ui-monospace, monospace; }
.variant-b .home-hero { max-width:1180px; margin:34px auto; padding:0 24px; display:grid; grid-template-columns:190px 1fr; gap:38px; }
.variant-b .hero-index { color:var(--muted); border-right:1px solid var(--line); padding-top:8px; font-size:12px; }
.variant-b .hero-index strong { display:block; margin:18px 0 4px; color:var(--text); }
.variant-b h1 { max-width:900px; font:800 clamp(45px,7vw,94px)/.9 ui-monospace, monospace; }
.variant-b .lede { max-width:680px; font-size:15px; }
.variant-b .command { max-width:680px; border-color:#5d2925; }
.variant-b .proof { max-width:1180px; margin:auto; padding:0 24px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.variant-b .proof article { border:1px solid var(--line); padding:20px; }
.variant-b .proof article:last-child { grid-column:span 2; }
.variant-b .proof h2 { font:700 17px/1.25 ui-monospace, monospace; letter-spacing:-.04em; }
.variant-b .docs-layout { grid-template-columns:240px minmax(0,1fr); gap:0; max-width:none; margin-top:0; padding:0; }
.variant-b .docs-nav { min-height:calc(100vh - 60px); padding:24px; background:#121212; }
.variant-b .docs-content { max-width:820px; padding:58px 54px; }
.variant-b .docs-content h1 { font:800 48px/.95 ui-monospace, monospace; }
.variant-b .docs-content h2 { font:700 23px/1.1 ui-monospace, monospace; }
.variant-b .docs-toc { display:none; }
/* C: layered product system, visual modules and a persistent documentation index. */
.variant-c .site-header { padding-top:34px; }
.variant-c .home-hero { max-width:1240px; margin:12px auto 0; padding:28px 32px 0; }
.variant-c h1 { max-width:900px; font-size:clamp(55px,8vw,112px); }
.variant-c .lede { max-width:510px; }
.variant-c .hero-stage { margin-top:42px; min-height:265px; display:grid; grid-template-columns:1.15fr .85fr; background:var(--raised); border:1px solid var(--line); }
.variant-c .stage-copy { padding:31px; border-right:1px solid var(--line); }
.variant-c .stage-copy strong { display:block; max-width:360px; font-size:27px; line-height:1.05; letter-spacing:-.05em; }
.variant-c .stage-code { padding:31px; display:flex; align-items:end; }
.variant-c .stage-code .command { width:100%; }
.variant-c .proof { max-width:1240px; margin:12px auto; padding:0 32px; display:grid; grid-template-columns:1.3fr .7fr .7fr; gap:12px; }
.variant-c .proof article { min-height:190px; padding:24px; background:var(--raised); border:1px solid var(--line); }
.variant-c .proof article:first-child { background:#e9e2da; color:#181716; }
.variant-c .proof article:first-child p { color:#514d47; }
.variant-c .proof h2 { font-size:27px; }
.variant-c .docs-layout { grid-template-columns:260px minmax(0,1fr); gap:0; max-width:none; margin-top:0; padding:0; }
.variant-c .docs-nav { min-height:calc(100vh - 82px); padding:38px 30px; border-right:1px solid var(--line); }
.variant-c .docs-content { max-width:850px; padding:70px 60px; }
.variant-c .docs-content h1 { font-size:70px; }
.variant-c .docs-toc { display:none; }
.variant-c .callout { margin:30px 0; background:var(--raised); padding:18px; border-left:3px solid var(--red); }
@media (max-width:760px) { .site-header { padding:18px; } .site-nav a:not(.install-link) { display:none; } .home-hero, .variant-b .home-hero { display:block; padding-inline:20px; } .variant-a .hero-side, .variant-b .hero-index { display:none; } .proof, .variant-a .proof, .variant-b .proof, .variant-c .proof { grid-template-columns:1fr; padding-inline:20px; } .variant-a .proof article, .variant-a .proof article+article, .variant-b .proof article:last-child { padding:20px 0; grid-column:auto; border-right:0; border-bottom:1px solid var(--line); } .variant-c .hero-stage { grid-template-columns:1fr; } .variant-c .stage-copy { border-right:0; border-bottom:1px solid var(--line); } .docs-layout, .variant-b .docs-layout, .variant-c .docs-layout { display:block; padding:0 20px; } .docs-nav, .variant-b .docs-nav, .variant-c .docs-nav { display:none; } .docs-content, .variant-b .docs-content, .variant-c .docs-content { padding:32px 0; } .docs-content h1, .variant-c .docs-content h1 { font-size:48px; } .switcher strong { min-width:120px; } }
</style>
</head>
<body>
<p class="prototype-note">PROTOTYPE. Pick a direction, then discard this file.</p>
<div id="app"></div>
<div class="switcher" aria-label="Visual prototype variants">
  <button id="previous" type="button" aria-label="Previous visual variant">←</button>
  <strong id="variant-label"></strong>
  <button id="next" type="button" aria-label="Next visual variant">→</button>
</div>
<script>
const variants = { A: 'Editorial forge', B: 'Terminal ledger', C: 'Signal stack' };
const params = new URLSearchParams(location.search);
let variant = variants[params.get('variant')] ? params.get('variant') : 'A';
let page = params.get('page') === 'docs' ? 'docs' : 'home';
const query = nextPage => `?variant=${variant}&page=${nextPage}`;
const header = () => `<header class="site-header"><a class="mark" href="${query('home')}"><img src="/azeforge-logo-transparent.png" alt=""><span class="word">Aze<span class="accent">Forge</span></span></a><nav class="site-nav" aria-label="Public"><a href="${query('docs')}" ${page === 'docs' ? 'aria-current="page"' : ''}>Docs</a><a href="#examples">Examples</a><a href="/playground">Playground</a><a class="install-link" href="#install">Install AzeForge</a></nav></header>`;
const home = () => `<main><section class="home-hero"><div><p class="eyebrow">AzeMark compiler and renderer</p><h1>Technical documents that render like the work deserves.</h1><p class="lede">AzeForge turns AzeMark Source into mathematics, diagrams, code listings, and publication-ready documents without leaving plain text.</p><div class="action-row"><a class="button primary" href="#install">Install AzeForge</a><a class="button" href="${query('docs')}">Read the docs</a></div><div id="install" class="command"><code>npm install @aruzone/aze-forge</code><button type="button" data-copy>Copy</button></div></div><aside class="hero-side"><div class="brand-geometry" aria-hidden="true"><img src="/azeforge-logo-transparent.png" alt=""></div><p class="eyebrow">Built for structured work</p><p>A language with directives for the parts Markdown leaves to plugins, one-off TeX, and manual formatting.</p></aside></section><section class="proof" id="examples"><article><p class="eyebrow">01 / Compose</p><h2>Keep the source readable.</h2><p>Metadata, prose, and directives live in one AzeMark document.</p></article><article><p class="eyebrow">02 / Render</p><h2>Compile the demanding parts.</h2><p>Tables, equations, graphs, diagrams, and figures get a real rendering path.</p></article><article><p class="eyebrow">03 / Ship</p><h2>Export without cleanup.</h2><p>Produce the document from source, with diagnostics when the compiler needs correction.</p></article></section></main>`;
const docs = () => `<main class="docs-layout"><nav class="docs-nav" aria-label="Documentation"><p>Start here</p><a class="active" href="#first-document">First document</a><a href="#install-docs">Install AzeForge</a><a href="#compile">Compile and render</a><p>Language</p><a href="#directives">Directive fences</a><a href="#diagnostics">Diagnostics</a><p>Reference</p><a href="#reference">Directive reference</a></nav><article class="docs-content"><p class="eyebrow">AzeMark 2 · AzeForge 0.6.2</p><h1 id="first-document">Your first document</h1><p class="lede">Create a plain-text source file, then let AzeForge validate and render it. Start with a document you can read before it compiles.</p><h2 id="install-docs">Install AzeForge</h2><div class="command"><code>npm install @aruzone/aze-forge</code><button type="button" data-copy>Copy</button></div><h2 id="directives">Write AzeMark Source</h2><p>Set the language version in front matter. Directive blocks use exactly four colons so the compiler can identify them without ambiguity.</p><pre class="code-block">---
azemark: 2
title: A first AzeMark document
---

:::: equation
E = mc^2
::::</pre><p class="callout">Validate before rendering. Preserve the location and suggested remedy from every diagnostic so a person or agent can fix the source.</p><h2 id="compile">Compile and render</h2><p>AzeForge validates the source, then renders the requested document format. The reference records the available directives, output formats, limits, and version contract.</p></article><aside class="docs-toc"><strong>On this page</strong><a href="#install-docs">Install</a><a href="#directives">Directive fences</a><a href="#compile">Compile</a></aside></main>`;
function render() {
  document.body.className = `variant-${variant.toLowerCase()}`;
  document.getElementById('app').innerHTML = `<div class="shell">${header()}${page === 'home' ? home() : docs()}</div>`;
  document.getElementById('variant-label').textContent = `${variant} · ${variants[variant]}`;
  document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', () => {
    navigator.clipboard?.writeText('npm install @aruzone/aze-forge'); button.textContent = 'Copied';
  }));
}
function switchVariant(step) {
  const keys = Object.keys(variants); variant = keys[(keys.indexOf(variant) + step + keys.length) % keys.length];
  history.replaceState(null, '', query(page)); render();
}
document.getElementById('previous').addEventListener('click', () => switchVariant(-1));
document.getElementById('next').addEventListener('click', () => switchVariant(1));
addEventListener('keydown', event => { const tag = document.activeElement?.tagName; if (!['INPUT', 'TEXTAREA'].includes(tag) && !document.activeElement?.isContentEditable) { if (event.key === 'ArrowLeft') switchVariant(-1); if (event.key === 'ArrowRight') switchVariant(1); } });
render();
</script>
</body>
</html>
