<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">AzeForge authoring workspace layouts</title><desc id="desc">Annotated desktop and tablet layouts showing fixed rail, document navigation, utility bar, preview and Cell canvas measurements.</desc><style>text{font:14px system-ui;fill:#162033}.label{font-size:12px;fill:#68758a}.nav{fill:#111827}.side{fill:#f8fafc;stroke:#d7dee8}.main{fill:#eef1f5}.surface{fill:white;stroke:#d7dee8}.accent{fill:#eaf1ff;stroke:#2563eb}</style><text x="20" y="28" font-weight="700">Desktop ≥1200 CSS px</text><rect class="nav" x="20" y="45" width="64" height="620"/><rect class="side" x="84" y="45" width="248" height="620"/><rect class="main" x="332" y="45" width="848" height="620"/><rect class="surface" x="332" y="45" width="848" height="56"/><rect class="surface" x="356" y="117" width="800" height="190"/><rect class="surface" x="404" y="333" width="680" height="74"/><rect class="accent" x="404" y="423" width="680" height="120"/><rect class="surface" x="404" y="559" width="680" height="80"/><text class="label" x="35" y="690">64 rail</text><text class="label" x="150" y="690">248 Current document</text><text class="label" x="350" y="92">56 utility</text><text class="label" x="370" y="145">Preview: 28%, min 180, max 60%</text><text class="label" x="416" y="360">Document details</text><text class="label" x="416" y="450">Cell canvas, max 920</text><text class="label" x="416" y="588">Single-column Cells</text><g transform="translate(760 470) scale(.5)"><text x="20" y="28" font-weight="700">Tablet 768–1199 CSS px</text><rect class="nav" x="20" y="45" width="56" height="620"/><rect class="main" x="76" y="45" width="620" height="620"/><rect class="surface" x="76" y="45" width="620" height="52"/><rect class="surface" x="92" y="113" width="588" height="180"/><rect class="accent" x="92" y="309" width="588" height="290"/><rect class="side" x="76" y="45" width="272" height="620"/><text class="label" x="90" y="78">272 modal Current document drawer</text><text class="label" x="365" y="78">52 utility</text><text class="label" x="110" y="142">Preview: 30%, min 160, max 50%</text><text class="label" x="110" y="340">Full-width one-column canvas · 16 inset</text></g></svg>
